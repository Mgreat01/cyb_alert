spring:
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:cyberwatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

cyberwatch:
  security:
    jwt-secret: test-only-cyberwatch-secret-with-at-least-32-bytes
