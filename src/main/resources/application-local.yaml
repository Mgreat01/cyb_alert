spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyberwatch}
    username: ${DB_USERNAME:cyberwatch}
    password: ${DB_PASSWORD:cyberwatch_dev}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}

cyberwatch:
  security:
    jwt-secret: ${CYBERWATCH_JWT_SECRET:change-this-local-development-secret-with-32-bytes}
