spring:
  application:
    name: cybAlert
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

cyberwatch:
  security:
    jwt-secret: ${CYBERWATCH_JWT_SECRET}
    access-token-duration: PT15M
    refresh-token-duration: P7D
