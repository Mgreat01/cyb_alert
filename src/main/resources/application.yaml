spring:
  application:
    name: cybAlert
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyberwatch}
    username: ${DB_USERNAME:cyberwatch}
    password: ${DB_PASSWORD:cyberwatch_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
