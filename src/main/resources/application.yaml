spring:
  application:
    name: cybAlert
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

cyberwatch:
  security:
    jwt-secret: ${CYBERWATCH_JWT_SECRET}
    access-token-duration: PT15M
    refresh-token-duration: P7D
